        <style>
            body {
                background-color: #000000;
                color: #ffffff;
                font-family: Arial, sans-serif;
                margin: 0;
            }

            .navbar {
                align-items: center;
                background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.65)), url("images/robot-banner.png");
                background-position: center;
                background-size: cover;
                border-bottom: 4px solid #ffd700;
                border-radius: 0 0 18px 18px;
                box-sizing: border-box;
                display: flex;
                height: 320px;
                justify-content: center;
                overflow: hidden;
                padding: 20px;
            }

            .logo {
                filter: drop-shadow(0 5px 10px #000000);
                max-width: 85%;
                width: 620px;
            }

            .form {
                background-color: #111111;
                border: 3px solid #ffd700;
                border-radius: 14px;
                margin-left: auto;
                margin-right: auto;
                margin-top: 20px;
                padding: 20px;
                width: 70%;
            }

            .form h1 {
                color: #ffd700;
                text-align: center;
            }

            table {
                width: 100%;
            }

            td {
                padding: 8px;
            }

            .question {
                color: #ffd700;
                font-weight: bold;
                padding-top: 20px;
            }

            input[type="text"],
            select {
                border: 2px solid #ffd700;
                border-radius: 6px;
                padding: 7px;
            }

            select {
                width: 292px;
            }

            input[type="radio"],
            input[type="checkbox"] {
                accent-color: #ffd700;
            }

            .team-name {
                color: #ffd700;
                font-weight: bold;
                text-align: center;
            }

            .section-table {
                margin-top: 15px;
            }

            .button-row {
                padding-top: 20px;
                text-align: right;
            }

            input[type="reset"],
            input[type="submit"] {
                background-color: #ffd700;
                border: 2px solid #ffffff;
                border-radius: 8px;
                color: #000000;
                cursor: pointer;
                font-weight: bold;
                margin-left: 8px;
                padding: 10px 18px;
            }

            input[type="reset"]:hover,
            input[type="submit"]:hover {
                background-color: #ffffff;
                border-color: #ffd700;
            }
